name: Button
description: >-
  Button (usebutton.com) is a mobile commerce technology company whose platform connects
  Publishers and Brands in a two-sided marketplace: publishers deep-link their users into
  retailer apps and sites with full attribution, and brands acquire and re-engage customers
  through those optimized journeys. Its server-to-server APIs cover personalized Offers,
  attributed Link and Shortlink generation (including Amazon creator links), Brand partnership
  details, Billing/affiliation transaction reporting, and Order reporting, complemented by
  Publisher SDKs, Merchant Libraries, and HMAC-signed transaction webhooks.
