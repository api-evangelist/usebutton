apis:
- name: Button Order API
  description: >-
    Brands report new orders, order updates (including partial returns), and cancellations to Button server-to-server,
    passing the Button Attribution Token (btn_ref) captured by the Merchant Library; documented in the
    guides with create (POST /v1/order), update (POST /v1/order/{order_id}), and cancel (DELETE /v1/order/{order_id}).
  humanURL: https://developer.usebutton.com/docs/order-api-overview
  baseURL: https://api.usebutton.com/v1/order
  tags:
